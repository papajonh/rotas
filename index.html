<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota com OpenRouteService</title>
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.offline@3.2.1/dist/leaflet.offline.css" />
    
    <!-- CSS do plugin Fullscreen -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@3.0.0/Control.FullScreen.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.offline@3.2.1/dist/bundle.js"></script>
    <!-- JS do plugin Fullscreen -->
    <script src="https://unpkg.com/leaflet.fullscreen@3.0.0/Control.FullScreen.js"></script>
    <script src="javascript/libJData/jdata.js"></script>
    
    <style>
        html, body { margin: 0; padding: 0;}
        #map { height: 100vh; width: 100%; }
        #info {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 14px;
        }
        .pref-coords{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            padding: 10px;
            width: 100%;
        }
        .way-points{
            padding: 5px;
            margin-left: 10px;
            margin-right: 10px;
            
        }
            
        .way-points div{
            align-items: center;
            text-align: center;
            
        }
          
        .way-points div input{
            align-items: center;
            text-align: center;
            border: 2px black solid;
        }
        .btn{
            padding: 15px;
            margin-right: 5px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
        .btn button{
            margin: 5px;
            width: 120px;
            background-color: blue;
            color: white;
        }
         .btn input{
            margin: 5px;
            background-color: blue;
            color: white;
        }

        .leaflet-control{
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 34px;
            align-items: center;
        }

        .history-btn {
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            background-clip: padding-box;
            border-radius: 4px;
            width: 34px;
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        }
        .history-btn:hover { background-color: #f4f4f4; }
        
        .history-panel {
            position: absolute;
            top: 60px;
            left: 10px;
            background: white;
            border: 2px solid rgba(0,0,0,0.2);
            background-clip: padding-box;
            border-radius: 4px;
            width: 280px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            display: none;
            z-index: 1000;
            font-family: sans-serif;
            font-size: 13px;
        }
        .history-panel.active { display: block; }
        .history-header {
            background: #f8f9fa;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:hover { background-color: #f0f8ff; }
        
        .history-item-content {
            flex: 1;
            overflow: hidden;
        }
        .history-item-route {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-route-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 8px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-route-btn:hover {
            background: #cc0000;
        }
        /* Botão GPS */
        .gps-btn {
            position: absolute;
            top: 100px;
            right: 20px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #2c7be5;
            color: white;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: background 0.2s, transform 0.2s;
        }

        .gps-btn:hover { background: #1a5fc0; }
        .gps-btn:active { transform: scale(0.95); }
        .gps-btn.loading { background: #999; pointer-events: none; }
        .gps-btn.loading::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: white;
            animation: gps-spin 0.8s linear infinite;
        }

        @keyframes gps-spin {
            to { transform: rotate(360deg); }
        }

        /* Marcador de posição atual */
        .current-location-marker {
            background: transparent;
            border: none;
        }
        .current-location-dot {
            width: 20px;
            height: 20px;
            background: #2c7be5;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(44, 123, 229, 0.8);
            position: relative;
        }
        .current-location-dot::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(44, 123, 229, 0.25);
            animation: gps-pulse 2s ease-out infinite;
        }
        @keyframes gps-pulse {
            0%   { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
      .gps-btn.single-active {
    background: #2c7be5;          
    }

    .gps-btn.loop-active {
        background: #e63946;          
        animation: gps-loop-pulse 1.5s ease-in-out infinite;
    }

    @keyframes gps-loop-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.6); }
        50%      { box-shadow: 0 0 0 10px rgba(230, 57, 70, 0); }
    }


    @media (max-width: 520px) {
            .way-points{
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
            
        .way-points div{
            align-items: center;
            text-align: center;
        }
    }
    </style>
</head>
<body>
    <div class="pref-coords" id="pref-coords">
        <div class="way-points" >
            <div>
                <label>Coordenada inicial</label><br>
                <input id="name0" type="text" value="INICIO"/>
            </div>
            <div>
                <label>Coordenadas</label><br>
                <input id="coord0" type="text"/>
            </div>
        </div>
        <div class="way-points">
            <div>
                <label for="name">Nome</label><br>
                <input id="name1" type="text"/>
            </div>
            <div>
                <label for="name">Coordenadas</label><br>
                <input id="coord1" type="text"/>
            </div>
        </div>
    </div>
    <div class="btn">
        <button id="add-way-points">Adicionar Ponto</button>
        <button id="trace-route">Traçar Rota</button>
        <button id="download-route">Baixar Rota</button><br>
        <input type="file" id="load-route" placeholder="Carregar rota"/>
    </div>
    
    <div id="map">
        <div id="info">Calculando rota...</div>
        <button id="gps-btn" class="gps-btn" title="Atualizar localização atual">📍</button>
    </div>
    
    <script>
        // ====== CONFIG ======
        let key;
        let count = 1;
        let namePoints = [];
        let coords = [];
        let currentRouteLayer = null;
        let currentMarkers = [];
        let currentRouteToDownload;
        const ORS_URL = 'https://api.heigit.org/openrouteservice/v2/directions/driving-car/geojson';

        let startCoord = [-3.8575446, -40.9250892];
        
        // ====== LOAD CONFIG ======
        (async function () {
            try {
                const r = await fetch('storage/conf.jdata');
                if (!r.ok) throw new Error('Falha ao carregar conf');
                const texto = await r.text();
                const conf = JData.parse(texto);
                key = conf["Conf"].key;
            } catch (erro) {
                console.error('Erro:', erro);
                document.getElementById('info').textContent = 'Erro ao carregar configuração.';
            }
        })();

        // ====== BASE LAYERS ======
        const osmLayer = L.tileLayer.offline(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            { attribution: '© OpenStreetMap contributors', subdomains: 'abc', crossOrigin: true, maxZoom: 19 }
        );
        const terrainLayer = L.tileLayer.offline(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
            { attribution: 'Tiles © Esri', maxZoom: 19, crossOrigin: true, maxNativeZoom: 16 }
        );
        const satelliteLayer = L.tileLayer.offline(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            { attribution: 'Tiles © Esri', maxZoom: 19, crossOrigin: true, maxNativeZoom: 16 }
        );

        const layers = { osm: osmLayer, terrain: terrainLayer, satellite: satelliteLayer };

        // ====== RESTORE SAVED LAYER ======
        const savedLayer = localStorage.getItem('baseLayer') || 'osm';
        const initialLayer = layers[savedLayer] || osmLayer;

        // ====== INIT MAP ======
        const map = L.map('map', { center: startCoord, zoom: 14, layers: [initialLayer] });
        document.getElementById('info').textContent = 'Insira a rota...';

        // ====== FULLSCREEN CONTROL ======
        L.control.fullscreen({
            position: 'topleft',
            title: 'Tela Cheia',
            titleCancel: 'Sair da Tela Cheia',
            forceSeparateButton: true,
            forcePseudoFullscreen: true // Garante compatibilidade no iPhone
        }).addTo(map);

        // ====== LAYER CONTROL ======
        L.control.layers(
            { 'Ruas (OSM)': osmLayer, 'Terreno (Esri Topo)': terrainLayer, 'Satélite (Esri)': satelliteLayer },
            null, { position: 'topright', collapsed: false }
        ).addTo(map);
        
        // ====== SAVE MAP OFFLINE ======
        const saveControl = L.control.savetiles(osmLayer, {
            zoomlevels: [16], position: 'topleft', saveText: '💾', rmText: '🗑️'
        });
        saveControl.addTo(map);

        // ====== CUSTOM CONTROL: SAVED ROUTES BUTTON ======
        L.Control.RoutesHistory = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar');
                const btn = L.DomUtil.create('a', 'history-btn', container);
                btn.innerHTML = '📋';
                btn.href = '#';
                btn.title = 'Rotas Salvas';

                const panel = L.DomUtil.create('div', 'history-panel');
                document.body.appendChild(panel);

                L.DomEvent.on(btn, 'click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    L.DomEvent.preventDefault(e);
                    if (panel.classList.contains('active')) {
                        panel.classList.remove('active');
                    } else {
                        panel.classList.add('active');
                        loadSavedRoutes(panel);
                    }
                });
                return container;
            }
        });
        map.addControl(new L.Control.RoutesHistory());

        // ====== FUNCTION TO LIST SAVED ROUTES ======
        function loadSavedRoutes(panel) {
            panel.innerHTML = '<div class="history-header">Rotas Salvas <span style="cursor:pointer" onclick="this.parentElement.parentElement.classList.remove(\'active\')">✖</span></div>';
            
            let foundRoutes = 0;
            
            for (let i = 0; i < localStorage.length; i++) {
                const storageKey = localStorage.key(i);
                
                if (storageKey.startsWith('route_')) {
                    foundRoutes++;
                    
                    const savedData = JSON.parse(localStorage.getItem(storageKey));
                    const visualCoords = savedData.coords.map(c => `[${c[0].toFixed(4)}, ${c[1].toFixed(4)}]`).join(' ➔ ');
                    
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    
                    const itemContent = document.createElement('div');
                    itemContent.className = 'history-item-content';
                    itemContent.innerHTML = `
                        <b>Rota ${foundRoutes}</b><br>
                        <div class="history-item-route" title="${visualCoords}">${visualCoords}</div>
                    `;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-route-btn';
                    deleteBtn.innerHTML = '🗑️';
                    deleteBtn.title = 'Excluir Rota';
                    
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm('Tem certeza que deseja apagar esta rota?')) {
                            localStorage.removeItem(storageKey);
                            
                            if (currentRouteLayer) {
                                map.removeLayer(currentRouteLayer);
                                currentMarkers.forEach(m => map.removeLayer(m));
                                currentRouteLayer = null;
                                currentMarkers = [];
                                document.getElementById('info').textContent = 'Rota removida.';
                            }
                            
                            loadSavedRoutes(panel);
                        }
                    };

                    itemContent.onclick = () => {
                        const routeData = JSON.parse(localStorage.getItem(storageKey));
                        if (routeData) {
                            namePoints = routeData.names || [];
                            drawRoute(routeData.data, routeData.coords);
                            panel.classList.remove('active');
                        }
                    };
                    
                    item.appendChild(itemContent);
                    item.appendChild(deleteBtn);
                    panel.appendChild(item);
                }
            }

            if (foundRoutes === 0) {
                panel.innerHTML += '<div style="padding: 15px; text-align: center; color: #888;">Nenhuma rota salva ainda.</div>';
            }
        }

        // ====== SAVE LAYER ON CHANGE ======
        map.on('baselayerchange', function (e) {
            const name = Object.keys(layers).find(k => layers[k] === e.layer);
            if (name) {
                localStorage.setItem('baseLayer', name);
                saveControl.setLayer(e.layer);
            }
        });

        osmLayer.on('savestart', function(e) { document.getElementById('info').textContent = 'Baixando mapa offline...'; });
        osmLayer.on('saveend', function(e) { document.getElementById('info').textContent = 'Mapa salvo para uso offline!'; });

        // ====== EVENT LISTENERS ======
        document.getElementById("add-way-points").addEventListener("click", () => {
            count++;
            const wayPointDiv = document.createElement('div');
            wayPointDiv.className = 'way-points';
            wayPointDiv.innerHTML = `
                <div>
                    <label for="name${count}">Nome</label><br>
                    <input id="name${count}" type="text"/>
                </div>
                <div>
                    <label for="coord${count}">Coordenadas</label><br>
                    <input id="coord${count}" type="text"/>
                </div>
            `;
            document.getElementById("pref-coords").appendChild(wayPointDiv);
        });

        document.getElementById("trace-route").addEventListener("click", () => {
            coords = [];
            namePoints = []; 
            
            for(let i=0; i <= count; i++){
                let inputVal = document.getElementById("coord"+i).value;
                const inputName = document.getElementById("name"+i).value;
                
                inputVal = inputVal.replace(/(\d),(\d)/g, "$1.$2").replace(/[{"lat":"lng":}[\]()]/g, "");

                if (inputVal.trim() !== "") {
                    let arryCurrentCoords = inputVal.split(",").map(c => Number(c.trim()));
                    if (arryCurrentCoords.length === 2 && !isNaN(arryCurrentCoords[0]) && !isNaN(arryCurrentCoords[1])) {
                        coords.push([arryCurrentCoords[0], arryCurrentCoords[1]]);
                        namePoints.push(inputName || "Sem nome"); 
                    }
                }
            }
            
            if (coords.length >= 2) {
                traceRoute(key, coords);
            } else {
                document.getElementById('info').textContent = 'Insira pelo menos duas coordenadas válidas (Ex: -3.85, -40.92).';
            }
        });

        document.getElementById("download-route").addEventListener("click", () => {
            if (currentRouteToDownload != undefined && currentRouteToDownload != null && currentRouteToDownload != "") {
                const jsonData = JSON.parse(currentRouteToDownload);
                const dataToDownload = JData.stringify(jsonData);

                const blob = new Blob([dataToDownload], { type: 'application/jdata' });
                const url = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = url;
                link.download = 'rota.jdata'; 
                document.body.appendChild(link);
                link.click();

                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            } else {
                document.getElementById('info').textContent = 'Sem rota traçada não pode ser baixada!.';
            }
        });
        document.getElementById("load-route").addEventListener("change", (event) => {
            const reader = new FileReader();
            const file = event.target.files[0];
            const extension = file.name.split('.').pop();

            if (!file) {
                return;
            }
            if(extension.toUpperCase() != "JDATA" ) {
                alert("Arquivo inválido, não é um tipo .jdata")
                return;
            }else{
                document.getElementById('info').textContent = 'Rota carregada com sucesso.';
            }  

            reader.onload = (e) => {
                const dataJData = e.target.result;
                try {
                    const dataObject = JData.parse(dataJData);

                    if (!dataObject || !dataObject.data || !dataObject.coords) {
                        document.getElementById('info').textContent = 'Arquivo não contém rota válida.';
                        return;
                    }

                    let features = dataObject.data.features;
                    if (features && !Array.isArray(features)) {
                        features = Object.values(features)[0] || [];
                    }

                    const blocks = features;
                    let featureFull = {};
                    
                    if (Array.isArray(blocks)) {
                        for (const block of blocks) {
                            if (block && typeof block === 'object') {
                                Object.assign(featureFull, block);
                            }
                        }
                    } else if (blocks && typeof blocks === 'object') {
                        featureFull = { ...blocks };
                    }

                    const geom = featureFull.geometry;
                    if (geom) {
                        if (!geom.coordinates || !Array.isArray(geom.coordinates)) {
                            const coordsExt = [];
                            const keys = Object.keys(geom).filter(k => !isNaN(parseInt(k))).sort((a, b) => a - b);
                            
                            for (const key of keys) {
                                coordsExt.push(geom[key]);
                            }

                            if (coordsExt.length > 0) {
                                geom.coordinates = coordsExt;
                                keys.forEach(key => delete geom[key]);
                            }
                        }
                    }

                    if (!geom || !Array.isArray(geom.coordinates) || geom.coordinates.length === 0) {
                        document.getElementById('info').textContent = 'Arquivo não contém geometria de rota válida.';
                        return;
                    }

                    dataObject.data.features = [featureFull];
                    
                    namePoints = dataObject.names || [];
                    
                    drawRoute(dataObject.data, dataObject.coords);

                    const orsCoords = dataObject.coords.map(c => [Number(c[1]), Number(c[0])]);
                    const cacheKey = 'route_' + JSON.stringify(orsCoords);
                    const payloadToSave = {
                        coords: dataObject.coords,
                        names: namePoints,
                        data: dataObject.data
                    };
                    
                    try {
                        const jsonString = JSON.stringify(payloadToSave);
                        localStorage.setItem(cacheKey, jsonString);
                        
                    } catch (e) {
                        alert("Erro ao salvar: " + e.message); 
                    }

                } catch (erro) {
                    document.getElementById('info').textContent = 'Arquivo inválido: ' + erro.message;
                    console.error("ERRO GERAL NO READER:", erro);
                    alert("Erro geral: " + erro.message); // Para você ver na tela
                }
            };

            reader.onerror = () => {
                document.getElementById('info').textContent = 'Erro ao ler o arquivo.';
            };
            reader.readAsText(file);
        });
        
        
        // ====== GPS: VEHICLE — 3s · 1 reading · movement filter ======
        let currentLocationMarker = null;
        let currentLocationCircle = null;
        let lastDrawnPosition = null;     

        let gpsIntervalId = null;
        let gpsLoopActive = false;
        let isFetching = false;
        let singleShotActive = false;
        let clickTimer = null;
        const DOUBLE_CLICK_DELAY = 300;

        // --- Vehicle parameters ---
        const GPS_INTERVAL_MS = 3500;      // 3.5s (fluid while moving)
        const READ_TIMEOUT_MS = 3000;      // timeout per reading
        const TARGET_ACCURACY_M = 15;      // realistic target while moving
        const MIN_MOVE_METERS = 5;         // ignore noise when stopped

        const gpsBtn = document.getElementById('gps-btn');

        // ---------- HELPERS ----------
        function setGpsLoading(isLoading) {
            if (isLoading) gpsBtn.classList.add('loading');
            else gpsBtn.classList.remove('loading');
        }

        function setGpsVisualState(state) {
            gpsBtn.classList.remove('active', 'loop-active', 'single-active');
            if (state === 'loop') {
                gpsBtn.classList.add('active', 'loop-active');
                gpsBtn.textContent = '🔄';
                gpsBtn.title = 'Loop active (3s) — double-click to stop';
            } else if (state === 'single') {
                gpsBtn.classList.add('single-active');
                gpsBtn.textContent = '📍';
                gpsBtn.title = 'Single location';
            } else if (state === 'loading') {
                gpsBtn.classList.add('loading');
                gpsBtn.textContent = '⏳';
            } else {
                gpsBtn.textContent = '📍';
                gpsBtn.title = '1 click: single | 2 clicks: 3s loop';
            }
        }

        function distanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ---------- SINGLE READING ----------
        function getCurrentPosition(options = {}) {
            return new Promise((resolve, reject) => {
                if (!('geolocation' in navigator)) {
                    reject(new Error('Localização não suportada.'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: READ_TIMEOUT_MS,
                    maximumAge: 0,
                    ...options
                });
            });
        }

        // ---------- DRAWING ----------
        function drawCurrentLocation(lat, lng, accuracy) {
            if (currentLocationMarker) map.removeLayer(currentLocationMarker);
            if (currentLocationCircle) map.removeLayer(currentLocationCircle);

            let color = '#e63946';
            if (accuracy <= TARGET_ACCURACY_M) color = '#2ecc71';
            else if (accuracy <= 30) color = '#f39c12';

            currentLocationCircle = L.circle([lat, lng], {
                radius: accuracy, color, fillColor: color,
                fillOpacity: 0.15, weight: 1
            }).addTo(map);

            const icon = L.divIcon({
                className: 'current-location-marker',
                html: `<div class="current-location-dot" style="background:${color}"></div>`,
                iconSize: [20, 20], iconAnchor: [10, 10]
            });

            currentLocationMarker = L.marker([lat, lng], { icon })
                .addTo(map)
                .bindPopup(`<b>MINHA LOCALIZAÇÃO</b><br>
                    Lat: ${lat.toFixed(6)}<br>
                    Lng: ${lng.toFixed(6)}<br>
                    Precisão: ±${Math.round(accuracy)} m`);
        }

        // ---------- ONE UPDATE ----------
        async function updateOnce(showPopup = false) {
            if (isFetching) return;
            isFetching = true;

            try {
                const position = await getCurrentPosition();
                const { latitude, longitude, accuracy, speed, heading } = position.coords;

                // Filter: only redraw if moved enough
                let moved = true;
                if (lastDrawnPosition) {
                    const d = distanceMeters(
                        lastDrawnPosition.lat, lastDrawnPosition.lng,
                        latitude, longitude
                    );
                    if (d < MIN_MOVE_METERS && accuracy >= lastDrawnPosition.accuracy) {
                        moved = false;
                    }
                }

                if (moved) {
                    lastDrawnPosition = { lat: latitude, lng: longitude, accuracy };
                    drawCurrentLocation(latitude, longitude, accuracy);
                    if (showPopup && currentLocationMarker) currentLocationMarker.openPopup();

                    // Follow vehicle (only if outside viewport)
                    if (!map.getBounds().contains([latitude, longitude])) {
                        map.setView([latitude, longitude], Math.max(map.getZoom(), 16));
                    }

                    // Fill coord0
                    const coordInput = document.getElementById('coord0');
                    if (coordInput) coordInput.value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;

                    const nameInput = document.getElementById('name0');
                    if (nameInput && (!nameInput.value || nameInput.value.trim() === '')) {
                        nameInput.value = 'MINHA LOCALIZAÇÃO';
                    }
                }

                // Info panel
                let status = '❌ Poor';
                if (accuracy <= TARGET_ACCURACY_M) status = '✅ Good (<15m)';
                else if (accuracy <= 30) status = '🟡 Medio (15-30m)';
                else if (accuracy <= 50) status = '🟠 Ruim (30-50m)';

                const speedKmh = speed != null && !isNaN(speed) ? (speed * 3.6).toFixed(1) + ' km/h' : '—';
                const mode = gpsLoopActive ? '🔄 LOOP (3s)' : '📍 UNICO';

                document.getElementById('info').innerHTML = `<b>${mode}</b> — ${status}<br>
                    Lat: ${latitude.toFixed(6)}<br>
                    Lng: ${longitude.toFixed(6)}<br>
                    Precisão: ±${accuracy.toFixed(1)} m<br>
                    Velocidade: ${speedKmh}`;
            } catch (err) {
                let msg = 'Erro ao obter localização.';
                switch (err.code) {
                    case 1: msg = 'Permissão negada. Authorize o  GPS.'; break;
                    case 2: msg = 'Localização dispoinivel.'; break;
                    case 3: msg = 'GPS timeout.'; break;
                    default: msg = err.message || msg;
                }
                document.getElementById('info').textContent = msg;
                if (err.code === 1 && gpsLoopActive) stopGpsLoop();
            } finally {
                isFetching = false;
                setGpsLoading(false);
                if (!gpsLoopActive && !singleShotActive) setGpsVisualState('off');
                else if (gpsLoopActive) setGpsVisualState('loop');
            }
        }

        // ---------- SINGLE SHOT ----------
        async function doSingleShot() {
            if (gpsLoopActive) return;
            singleShotActive = true;
            setGpsLoading(true);
            setGpsVisualState('loading');
            document.getElementById('info').textContent = 'Localização unica...';
            await updateOnce(true);
            singleShotActive = false;
            if (!gpsLoopActive) setGpsVisualState('off');
        }

        // ---------- LOOP ----------
        function startGpsLoop() {
            if (gpsLoopActive) return;
            gpsLoopActive = true;
            lastDrawnPosition = null;      // reset filter on start
            setGpsVisualState('loop');
            document.getElementById('info').textContent = 'GPS loop ativo (3s)...';
            updateOnce(false);
            gpsIntervalId = setInterval(() => updateOnce(false), GPS_INTERVAL_MS);
        }

        function stopGpsLoop() {
            if (gpsIntervalId !== null) {
                clearInterval(gpsIntervalId);
                gpsIntervalId = null;
            }
            gpsLoopActive = false;
            setGpsVisualState('off');
            document.getElementById('info').textContent = 'GPS loop parado.';
        }

        // ---------- CLICK DETECTION ----------
        gpsBtn.addEventListener('click', () => {
            if (clickTimer !== null) {
                clearTimeout(clickTimer);
                clickTimer = null;
                if (gpsLoopActive) stopGpsLoop();
                else startGpsLoop();
            } else {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    doSingleShot();
                }, DOUBLE_CLICK_DELAY);
            }
        });

        setGpsVisualState('off');
            
        // ====== TRACE ROUTE ======
        async function traceRoute(key, coords) {
            const infoDiv = document.getElementById('info');
            infoDiv.textContent = 'Calculando rota...';

            if (!key) {
                infoDiv.textContent = 'API Key não encontrada.';
                return;
            }

            const orsCoords = coords.map(c => [Number(c[1]), Number(c[0])]);
            const cacheKey = 'route_' + JSON.stringify(orsCoords);

            try {
                const cached = localStorage.getItem(cacheKey);
                let routeData;

                if (cached) {
                    console.log('Rota carregada do cache');
                    const parsedCache = JSON.parse(cached);
                    routeData = parsedCache.data;
                    namePoints = parsedCache.names || namePoints; 
                    drawRoute(routeData, coords);
                } else {
                    const resp = await fetch(ORS_URL, {
                        method: 'POST',
                        headers: { 'Authorization': key, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ coordinates: orsCoords, instructions: false })
                    });

                    if (!resp.ok) {
                        const err = await resp.text();
                        console.error('Erro ORS:', resp.status, err);
                        infoDiv.textContent = `Erro ao calcular rota (${resp.status}). Verifique as coordenadas.`;
                        return;
                    }

                    routeData = await resp.json();
                    
                    const payloadToSave = {
                        coords: coords,
                        names: namePoints,
                        data: routeData
                    };
                    
                    try {
                        localStorage.setItem(cacheKey, JSON.stringify(payloadToSave));
                    } catch (e) {
                        console.warn('Não foi possível salvar a rota no cache:', e);
                    }
                    
                    drawRoute(routeData, coords);
                }

            } catch (e) {
                console.error('Erro na requisição:', e);
                infoDiv.textContent = 'Erro de conexão com o serviço de rotas.';
            }
        }

        // ====== DRAW ROUTE ======
        function drawRoute(data, coordsOriginais) {
            const infoDiv = document.getElementById('info');

            const payloadToSave = {
                        coords: coordsOriginais,
                        names: namePoints,
                        data: data
            };

            currentRouteToDownload = JSON.stringify(payloadToSave);
            
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            currentMarkers.forEach(marker => map.removeLayer(marker));
            currentMarkers = [];

            currentRouteLayer = L.geoJSON(data, {
                style: { color: '#2c7be5', weight: 6, opacity: 0.85 }
            }).addTo(map);

            coordsOriginais.forEach((c, i) => {
                const name = namePoints[i] ? namePoints[i].toUpperCase() : "PONTO " + (i + 1);
                const marker = L.marker(c)
                    .addTo(map)
                    .bindPopup(`<b>PONTO ${i + 1}</b><br><b>${name}</b><br>Lat: ${c[0]}<br>Lng: ${c[1]}`);
                currentMarkers.push(marker);
            });

            map.fitBounds(currentRouteLayer.getBounds(), { padding: [30, 30] });

            const summary = data.features[0].properties.summary;
            const distKm = (summary.distance / 1000).toFixed(2);
            const durMin = Math.round(summary.duration / 60);
            infoDiv.innerHTML = `<b>Rota calculada</b><br>Distância: ${distKm} km<br>Duração: ${durMin} min`;
        }
    </script>
